
name: Compilação Android (APK)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 3. Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: 4. Verificar arquivos do projeto
        run: |
          echo "Verificando estrutura do projeto..."
          ls -la
          if [ -f "./gradlew" ]; then
            echo "Gradle Wrapper encontrado na raiz."
          elif [ -f "./android/gradlew" ]; then
            echo "Gradle Wrapper encontrado na pasta android."
          else
            echo "ERRO: gradlew não encontrado."
            echo "O projeto pode não estar configurado como projeto Android nativo."
            exit 1
          fi

      - name: 5. Compilar APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          elif [ -f "./android/gradlew" ]; then
            cd android
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: 6. Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: assistente-de-balanca-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
